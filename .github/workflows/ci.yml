name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    # CI-only configuration.
    # These values are intentionally non-production and contain no real credentials.
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-infraflow-jwt-secret-2026-not-for-production
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: infraflow_ci_test
      DB_USER: infraflow_ci
      DB_PASSWORD: infraflow_ci_password
      DB_SSL: "false"
      ENFORCE_COMPANY_SCOPE: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend test suite
        run: npm test

      - name: Verify application loads
        run: npm run verify:app

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web_admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web_admin/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
